[project]
name = "tinyqueue"
version = "1.0.0"
description = "A lightweight distributed job queue with REST API, PostgreSQL storage, background workers, retries, scheduling and dead-letter handling."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "prometheus-client>=0.21.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "coverage>=7.6.0",
    "psycopg[binary]>=3.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real PostgreSQL database (see tests/integration/conftest.py)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI's Depends()/Query() defaults are an intentional idiom, not the
# mutable-default-argument bug B008 warns about.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
